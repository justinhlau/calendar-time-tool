<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>7 Day Time Picker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="toolbar" aria-label="Calendar controls">
        <div class="brand">
          <h1>7 Day Time Picker</h1>
          <p id="weekRange"></p>
        </div>

        <div class="controls">
          <label class="field">
            <span>Date</span>
            <input id="startDate" type="date" />
          </label>

          <button id="prevWeek" class="icon-button control-button" type="button" aria-label="Previous week" title="Previous week">‹</button>
          <button id="todayWeek" class="control-button today-button" type="button">Today</button>
          <button id="nextWeek" class="icon-button control-button" type="button" aria-label="Next week" title="Next week">›</button>

          <label class="field">
            <span>Timezone</span>
            <select id="timezoneSelect">
              <option value="Pacific Time" selected>Pacific Time</option>
              <option value="Mountain Time">Mountain Time</option>
              <option value="Central Time">Central Time</option>
              <option value="Eastern Time">Eastern Time</option>
              <option value="Alaska Time">Alaska Time</option>
              <option value="Hawaii Time">Hawaii Time</option>
              <option value="UTC">UTC</option>
            </select>
          </label>

          <label class="field compact">
            <span>Step</span>
            <select id="stepMinutes">
              <option value="15">15m</option>
              <option value="30" selected>30m</option>
              <option value="60">60m</option>
            </select>
          </label>

          <label class="field compact">
            <span>From</span>
            <select id="dayStart"></select>
          </label>

          <label class="field compact">
            <span>To</span>
            <select id="dayEnd"></select>
          </label>

          <label class="field compact">
            <span>Join</span>
            <select id="rangeJoiner">
              <option value="or" selected>or</option>
              <option value="&">&amp;</option>
            </select>
          </label>
        </div>

        <div class="actions">
          <button id="clearSelection" type="button">Clear</button>
        </div>
      </section>

      <section class="workspace">
        <div class="calendar-panel" aria-label="Seven day calendar">
          <div id="calendarGrid" class="calendar-grid"></div>
        </div>

        <aside class="output-panel" aria-label="Formatted output">
          <div class="output-header">
            <h2>Output</h2>
            <button id="copyOutput" type="button">Copy</button>
          </div>
          <div id="outputText" class="output-text" role="textbox" tabindex="0" aria-readonly="true" aria-label="Formatted selected times"></div>
          <textarea id="copyBuffer" class="copy-buffer" readonly tabindex="-1" aria-hidden="true"></textarea>
        </aside>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
